name: Publish image to Docker Hub

on:
  push:
    branches:
      - "main"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Read manifest version
        id: manifest_version
        run: |
          VERSION=$(node -e "const fs=require('fs');const s=fs.readFileSync('src/server/routes/manifest.js','utf8');const m=s.match(/version:\\s*'([^']+)'/);if(!m){process.exit(1)};console.log(m[1]);")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ github.actor }}/${{ github.event.repository.name }}
          flavor: |
            latest=true
          tags: |
            type=raw,value=${{ steps.manifest_version.outputs.version }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
